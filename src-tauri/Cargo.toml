[package]
name = "parallel-translator"
version = "0.1.0"
description = "A local side-by-side translation editor"
authors = ["Junho"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yunjunhojj/naranhi"
homepage = "https://github.com/yunjunhojj/naranhi"

[lib]
name = "parallel_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "std"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "std"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
